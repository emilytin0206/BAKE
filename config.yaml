dataset:
  active_task: mmlu
  mmlu:
    split: test
    subsets:
    - high_school_mathematics
    limit: 10
    offset: 0
    shuffle: false
  gsm8k:
    split: train
    limit: 10
    offset: 0
evaluation:
  provider: ollama
  model_name: qwen2.5:7b
  base_url: http://localhost:11434/v1
  api_key: ollama
  temperature: 0.0
  max_tokens: 1024
  pricing:
    input_price: 0.0
    output_price: 0.0
optimizer:
  provider: ollama
  model_name: qwen2.5:32b
  base_url: http://localhost:11434/v1
  api_key: ollama
  temperature: 0.7
  max_tokens: 2048
  pricing:
    input_price: 2.5
    output_price: 10.0
paths:
  meta_prompt_dir: meta_prompt
  output_file: optimized_prompts.txt
  detailed_log: logs/detailed_results.jsonl
  rules_log: logs/rules_history.txt
  cost_log: logs/cost_report.csv
  opt_status: logs/optimization_status.csv
  trace_log: logs/refinement_trace.jsonl
  prompt_history: logs/prompt_history.jsonl
  rule_evolution: logs/rule_evolution.jsonl
execution:
  concurrency: 5
  max_retries: 3
  retry_delay: 1.0
bake:
  group_size: 3
  max_output_prompts: 8
  iterative: false
  iterative_prompt_count: 5
initial_prompts:
- Restate the task briefly, decompose it into minimal logical steps, solve each step,
  and produce a result that directly satisfies the goal.
- Solve the task with explicit reasoning, verifying correctness after each major step
  and revising any inconsistent logic before proceeding.
- Identify necessary assumptions, avoid unstated ones, reason only from given information,
  and choose the most consistent interpretation.
- Generate multiple solution strategies, compare them for correctness and efficiency,
  select the strongest, and output only the final result.
- Prioritize clarity and precision, keep reasoning concise, remove unnecessary complexity,
  and ensure the output fully meets the task.
